[package]
name = "cosmos-llm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Unified client for multiple LLM providers (OpenAI, Anthropic, and more)"
license = "MIT"
repository = "https://github.com/durableprogramming/cosmos-llm-rust"
documentation = "https://docs.rs/cosmos-llm"
readme = "README.md"
keywords = ["llm", "ai", "openai", "anthropic", "nlp"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["mock", "trongo"]
# `MockProvider`, for testing consumer code without a network or an API key.
# On by default: every consumer needs it for their own tests, and a separate
# testing crate that depended on this one would be a dependency cycle.
mock = ["tokio/time"]
# `from_trongo`/`to_trongo` for the IR types (`Message`, `ModelInfo`, ...),
# reading and writing TrongoScript data literals. The IR types themselves are
# plain serde and never need it.
trongo = ["dep:trongoscript"]

[dependencies]
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
async-stream = "0.3"
retry-policy = { path = "../retry-policy" }
tokio-util = { version = "0.7", default-features = false }
base64 = "0.22"
trongoscript = { version = "0.1", optional = true }

[build-dependencies]
# Evaluates `models.trongo` into the JSON table that `ModelInfo::builtin` reads.
trongoscript = "0.1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tokio-test = "0.4"
mockito = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
