[package]
name = "cosmos-llm-example"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Labeled examples and devsets for evaluating and tuning LLM programs"
license = "MIT"
repository = "https://github.com/durableprogramming/cosmos-llm-rust"
documentation = "https://docs.rs/cosmos-llm-example"
readme = "README.md"
keywords = ["llm", "ai", "dataset", "evaluation", "jsonl"]
categories = ["data-structures"]

[features]
default = []
# The `cosmos-llm-example` binary and the `cli` module behind it. Off by
# default so that crates holding examples do not compile an argument parser.
# Install with `cargo install --features cli`.
cli = ["dep:clap"]

[dependencies]
cosmos-llm-registry = { path = "../cosmos-llm-rust-registry" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Capped below 4.6, which raised its MSRV to 1.85.
clap = { version = ">=4.5, <4.6", features = ["derive"], optional = true }

[[bin]]
name = "cosmos-llm-example"
path = "src/main.rs"
required-features = ["cli"]
