[package]
name = "cosmos-llm-cache"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Swappable JSON-value caches for LLM completions: memory LRU, sharded disk, tiered"
license = "MIT"
repository = "https://github.com/durableprogramming/cosmos-llm-rust"
documentation = "https://docs.rs/cosmos-llm-cache"
readme = "README.md"
keywords = ["llm", "ai", "cache", "lru"]
categories = ["caching"]

[features]
default = []
# The `cosmos-llm-cache` binary and the `cli` module behind it. Off by default
# so that crates caching through this one do not compile an argument parser
# they never call. Install with `cargo install --features cli`.
cli = ["dep:clap"]

[dependencies]
cosmos-llm-registry = { path = "../cosmos-llm-rust-registry" }
thiserror = "2"
serde_json = "1"
sha2 = "0.10"
# Capped below 4.6, which raised its MSRV to 1.85.
clap = { version = ">=4.5, <4.6", features = ["derive"], optional = true }

[[bin]]
name = "cosmos-llm-cache"
path = "src/main.rs"
required-features = ["cli"]
